name: Publish

# Release the userscript and load-unpacked Chrome extension as versioned
# GitHub Release assets. Tampermonkey clients still update from @updateURL on
# main; the Release is the versioned publish artifact for both distributions.

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "when2meet-to-gcal.user.js"
      - "extension/**"
      - "src/**"
      - "scripts/build-extension.mjs"
      - "scripts/version.mjs"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI checks
        run: pnpm run ci:all

  deploy-userscript:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get package metadata
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Deploy userscript release asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: v${{ steps.package.outputs.version }}
          prerelease: ${{ contains(steps.package.outputs.version, 'beta') || contains(steps.package.outputs.version, 'alpha') || contains(steps.package.outputs.version, 'rc') }}
          files: when2meet-to-gcal.user.js
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          body: |
            ## ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}

            Tampermonkey userscript and Chrome extension release. Assets are deployed in separate CI stages so either distribution can be retried independently.

            ### Install / update

            **Raw (auto-update via `@updateURL`):**

            https://raw.githubusercontent.com/${{ github.repository }}/main/when2meet-to-gcal.user.js

            **This release asset:** download `when2meet-to-gcal.user.js` below, or open the raw URL after this tag is on `main`.

            After install, Tampermonkey updates when `@version` on `main` increases.

            **Chrome extension:** download `when2meet-to-gcal-chrome-extension-v${{ steps.package.outputs.version }}.zip`, unzip it, then load the extracted `extension` directory from `chrome://extensions` with Developer mode enabled.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-chrome-extension:
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get package version
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package Chrome extension
        run: pnpm run extension:package

      - name: Deploy Chrome extension release asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.package.outputs.version }}
          files: when2meet-to-gcal-chrome-extension-v${{ steps.package.outputs.version }}.zip
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish summary
        if: always()
        run: |
          echo "## Publish summary"
          echo "- package version: ${{ steps.package.outputs.version }}"
          echo "- Chrome extension asset: when2meet-to-gcal-chrome-extension-v${{ steps.package.outputs.version }}.zip"
