name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deploy-check:
    name: Check release packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check userscript release asset
        run: |
          test -s when2meet-to-gcal.user.js
          node --check when2meet-to-gcal.user.js
      - name: Package Chrome extension
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ARCHIVE="when2meet-to-gcal-chrome-extension-v${VERSION}.zip"
          pnpm run extension:build
          zip -q -r "$ARCHIVE" extension
          unzip -tq "$ARCHIVE"
          unzip -l "$ARCHIVE" | grep -F "extension/manifest.json"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci:all
