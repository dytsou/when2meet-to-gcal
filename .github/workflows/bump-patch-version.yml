# Bump package.json patch via dytsou/release and open a PR.
# Then sync userscript @version + extension manifest onto that PR branch
# so CI version:check / extension:check pass.

name: Bump patch version

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bumpPatchVersion:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: dytsou/release/bump-patch-version@98055479dc1f0015d278ecd26b54ec6897d85eed # v1.3.6
        id: bump

      - name: Sync userscript and extension versions
        if: steps.bump.outputs.version != ''
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: chore/bump-patch-version-${{ github.run_id }}
        run: |
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          node scripts/version.mjs sync
          if git diff --quiet; then
            echo "already synced: $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add when2meet-to-gcal.user.js extension/manifest.json
          git commit -m "chore: sync version ${VERSION} into userscript and extension"
          git push origin "HEAD:$BRANCH"
